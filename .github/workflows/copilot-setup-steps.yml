name: "Copilot Setup Steps"

# Run setup steps when this file changes (for easy validation),
# and allow manual runs from the Actions tab.
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/copilot-setup-steps.yml
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` to be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Install Java 21
        uses: actions/setup-java@v5.2.0
        with:
          java-version: 21
          distribution: temurin

      - name: Install unrar
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unrar

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: false

      - name: Pre-warm Gradle dependency cache
        run: ./gradlew dependencies
