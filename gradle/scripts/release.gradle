release {

    preTagCommitMessage = "[Release] Version:"
    tagCommitMessage = "[Release] Version:"
    newVersionCommitMessage = "[Release] Update Version:"
    tagTemplate = 'v${version}'
    // Only build and publish the released artifacts. 'assemble' is deliberately not used,
    // because it pulls in the Spring Cloud Contract stub generation (generateClientStubs/verifierStubsJar),
    // and no test or verification task should be able to fail a release.
    buildTasks = ['bootJar', 'jar', 'sourcesJar', 'javadocJar', 'jib', 'jibBuildTar', 'publish']

    git {
        requireBranch.set("release")
    }
}

tasks.named("afterReleaseBuild") {
    dependsOn("updateMkdocsConfig", "updateK8sYaml")
}
