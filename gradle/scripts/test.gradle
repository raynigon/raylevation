test {
    useJUnitPlatform()
    // Possible install locations of the GDAL JNI library (libgdalalljni) in the GDAL container images
    def jniDirectories = ["/usr/lib/jni", "/usr/lib/x86_64-linux-gnu/jni", "/usr/lib/aarch64-linux-gnu/jni", "/usr/share/java", "/usr/local/lib"]
    jvmArgs "-Djava.library.path=${jniDirectories.join(File.pathSeparator)}"
    testLogging {
        events "failed"
        exceptionFormat = "full"
    }
}

jacoco {
    toolVersion = "0.8.14"
}

tasks.test {
    finalizedBy(tasks.jacocoTestReport) // report is always generated after tests run
}

tasks.jacocoTestReport {
    dependsOn(tasks.test) // tests are required to run before generating the report
    reports {
        xml.required = true
        html.required = true
        csv.required = false
    }
}
