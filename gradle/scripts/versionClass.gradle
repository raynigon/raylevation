import java.time.OffsetDateTime
import java.util.regex.Pattern

def generateVersionClass = tasks.register('generateVersionClass') {
    mustRunAfter(tasks.named('clean'))
    group = 'build'
    // Capture project values at configuration time, Task.project is not allowed at execution time
    def baseDirectory = layout.projectDirectory.dir("build/generated/sources/version/java").asFile.toPath()
    def projectGroup = project.group.toString()
    def projectName = project.name
    def projectVersion = project.version.toString()
    doFirst {
        // change package name
        def packageName = projectGroup.replace("-", "_") + "." + projectName.replace("-", "_")
        def targetDirectory = baseDirectory.resolve(packageName.replace(".", "/"))
        targetDirectory.toFile().mkdirs()
        String version = projectVersion
        Pattern versionPattern = Pattern.compile("^[0-9]+\\.[0-9]+\\.[0-9]+(?>-SNAPSHOT)?\$")
        if (!versionPattern.matcher(version).find()){
            version = "0.0.1-SNAPSHOT"
        }
        new File(targetDirectory.toFile(), "BuildVersion.java").text = """package ${packageName};
import java.time.OffsetDateTime;

public class BuildVersion {
    public static final String ARTIFACT_ID = "${projectName}";
    public static final String GROUP_ID = "${projectGroup}";


    public static final String VERSION = "${version}";
    public static final int MAJOR_VERSION = ${version.split("\\.")[0]};
    public static final int MINOR_VERSION = ${version.split("\\.")[1]};
    public static final int PATCH_VERSION = ${version.split("\\.")[2].split('-')[0]};
    public static final boolean SNAPSHOT = ${version.contains("-")};
    public static final OffsetDateTime BUILD_DATE = OffsetDateTime.parse("${OffsetDateTime.now().toString()}");
}"""
    }
}

tasks.named('compileJava') { dependsOn(generateVersionClass) }