
tasks.register('updateMkdocsConfig') {
    group = "external"
    doFirst {
        def cfg = project.file(project.file('mkdocs.yml'))
        cfg.text = cfg.text.replaceAll(/(?m)latest_version:.*/, "latest_version: ${project.version}")
    }
}

tasks.register('updateK8sYaml') {
    group = "external"
    def manifests = [project.file('deployment/k8s/install-minimum.yaml'), project.file('deployment/k8s/install-full.yaml')]
    def version = project.version
    doFirst {
        manifests.each { manifest ->
            manifest.text = manifest.text.replaceAll(/ghcr.io\/raynigon\/raylevation:.*/, "ghcr.io/raynigon/raylevation:v${version}")
            manifest.text = manifest.text.replaceAll(/app.kubernetes.io\/version: .*/, "app.kubernetes.io/version: ${version}")
        }
    }
}
