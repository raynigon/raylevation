name: Get elevation for location with locations of an invalid type
request:
  url: /api/v1/lookup
  method: POST
  headers:
    Content-Type: application/json
  body:
    locations: "abc"
response:
  status: 400
  headers:
    Content-Type: application/json
  body:
    status: 400 BAD_REQUEST
    message: InvalidBody
